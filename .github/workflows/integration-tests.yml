name: Plugin Integration Tests

on:
  workflow_call:
    inputs:
      timeout-minutes:
        description: 'Timeout for the test step in minutes'
        type: number
        default: 60
      ref:
        description: 'Git ref to check out. Defaults to the caller workflow''s ref; set explicitly when a scheduled matrix job needs to test a non-default branch.'
        type: string
        default: ''
      elastic-stack-versions:
        description: 'JSON array of ELASTIC_STACK_VERSION values to test against. Empty string = use the built-in default matrix (which also adds snapshot-only 9.next and main entries via includes). Setting this drops the include block so you get a strict cartesian product of versions × [snapshot:false, snapshot:true].'
        type: string
        default: ''
      distribution:
        description: 'Stack distribution (default | oss). Passed through to the setup action as the DISTRIBUTION env var.'
        type: string
        default: 'default'
      notify-slack:
        description: 'Send a Slack notification on failure.'
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  integration-tests:
    name: Integration Tests / Stack ${{ matrix.elastic-stack-version }} ${{ matrix.snapshot && '(Snapshot)' || '' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        elastic-stack-version: ${{ fromJSON(inputs.elastic-stack-versions != '' && inputs.elastic-stack-versions || '["8.current","9.current"]') }}
        snapshot: [false, true]
        include: ${{ fromJSON(inputs.elastic-stack-versions != '' && '[]' || '[{"elastic-stack-version":"9.next","snapshot":true},{"elastic-stack-version":"main","snapshot":true}]') }}

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6
        with:
          ref: ${{ inputs.ref }}

      - name: Setup test environment
        id: setup
        uses: logstash-plugins/.ci/setup@1.x
        with:
          elastic-stack-version: ${{ matrix.elastic-stack-version }}
          snapshot: ${{ matrix.snapshot }}
          integration: true
          distribution: ${{ inputs.distribution }}

      - name: Run integration tests
        if: steps.setup.outputs.skip != 'true'
        timeout-minutes: ${{ inputs.timeout-minutes }}
        run: bash .ci/docker-run.sh

      - name: Notify Slack on failure
        if: ${{ failure() && github.event_name != 'pull_request' && inputs.notify-slack }}
        uses: elastic/oblt-actions/slack/send@v1
        with:
          bot-token: ${{ secrets.SLACK_BOT_TOKEN }}
          channel-id: '#logstash-plugin-ci'
          message: ":red_circle: Integration tests failed for `${{ github.repository }}@${{ github.ref_name }}` (Stack ${{ matrix.elastic-stack-version }}${{ matrix.snapshot && ' snapshot' || '' }}) — <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View run>"
