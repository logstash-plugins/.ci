name: Plugin Unit Tests

on:
  workflow_call:
    inputs:
      timeout-minutes:
        description: 'Timeout for the test step in minutes'
        type: number
        default: 60
      ref:
        description: 'Git ref to check out. Defaults to the caller workflow''s ref; set explicitly when a scheduled matrix job needs to test a non-default branch.'
        type: string
        default: ''
      elastic-stack-versions:
        description: 'JSON array of ELASTIC_STACK_VERSION values to test against. Empty string = use the built-in default matrix.'
        type: string
        default: ''
      distribution:
        description: 'Stack distribution (default | oss). Passed through to the setup action as the DISTRIBUTION env var.'
        type: string
        default: 'default'
      notify-slack:
        description: 'Send a Slack notification on failure.'
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  unit-tests:
    name: Unit Tests / Stack ${{ matrix.elastic-stack-version }}${{ matrix.snapshot && ' (Snapshot)' || '' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        elastic-stack-version: ${{ fromJSON(inputs.elastic-stack-versions != '' && inputs.elastic-stack-versions || '["8.current","9.previous","9.current","9.next","main"]') }}
        snapshot: [false, true]
        docker-env: ['dockerjdk21.env']
        exclude:
          # 9.next and main only run as snapshot
          - elastic-stack-version: '9.next'
            snapshot: false
          - elastic-stack-version: 'main'
            snapshot: false

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6
        with:
          ref: ${{ inputs.ref }}

      - name: Setup test environment
        id: setup
        uses: logstash-plugins/.ci/setup@1.x
        with:
          elastic-stack-version: ${{ matrix.elastic-stack-version }}
          snapshot: ${{ matrix.snapshot }}
          docker-env: ${{ matrix.docker-env }}
          distribution: ${{ inputs.distribution }}

      - name: Run tests
        if: steps.setup.outputs.skip != 'true'
        timeout-minutes: ${{ inputs.timeout-minutes }}
        run: bash .ci/docker-run.sh

      - name: Notify Slack on failure
        if: ${{ failure() && github.event_name != 'pull_request' && inputs.notify-slack }}
        uses: elastic/oblt-actions/slack/send@v1
        with:
          bot-token: ${{ secrets.SLACK_BOT_TOKEN }}
          channel-id: '#logstash-plugin-ci'
          message: ":red_circle: Unit tests failed for `${{ github.repository }}@${{ github.ref_name }}` (Stack ${{ matrix.elastic-stack-version }}${{ matrix.snapshot && ' snapshot' || '' }}) — <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View run>"
