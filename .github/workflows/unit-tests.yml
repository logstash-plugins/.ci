name: Plugin Unit Tests

on:
  workflow_call:
    inputs:
      timeout-minutes:
        description: 'Timeout for the test step in minutes'
        type: number
        default: 60
      ref:
        description: 'Git ref to check out. Defaults to the caller workflow''s ref; set explicitly when a scheduled matrix job needs to test a non-default branch.'
        type: string
        default: ''

permissions:
  contents: read

jobs:
  unit-tests:
    name: Unit Tests / ES ${{ matrix.elastic-stack-version }}${{ matrix.snapshot && ' (Snapshot)' || '' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        elastic-stack-version:
          - '8.current'
          - '9.previous'
          - '9.current'
          - '9.next'
          - 'main'
        snapshot: [false, true]
        docker-env: ['dockerjdk21.env']
        exclude:
          # 9.next and main only run as snapshot
          - elastic-stack-version: '9.next'
            snapshot: false
          - elastic-stack-version: 'main'
            snapshot: false

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ inputs.ref }}

      - name: Setup test environment
        id: setup
        uses: logstash-plugins/.ci/setup@1.x
        with:
          elastic-stack-version: ${{ matrix.elastic-stack-version }}
          snapshot: ${{ matrix.snapshot }}
          docker-env: ${{ matrix.docker-env }}

      - name: Run tests
        if: steps.setup.outputs.skip != 'true'
        timeout-minutes: ${{ inputs.timeout-minutes }}
        run: bash .ci/docker-run.sh
