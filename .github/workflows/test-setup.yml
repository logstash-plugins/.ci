name: test-setup

on:
  pull_request:
    branches:
      - "1.x"
  push:
    branches:
      - feature/github-actions

jobs:
  test-setup-action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: ./setup
        with:
          elastic-stack-version: "9.current"
          snapshot: false
