name: Slack Notification Smoke Test

# Throwaway workflow to verify SLACK_BOT_TOKEN + channel wiring.
# Runs on push to the test branch so it fires WITHOUT being merged to the
# default branch (workflow_dispatch would only appear on the default branch).
# Confirm the message lands in the target channel, then delete this file.
#
# NOTE: This runs as a top-level workflow (not reusable), so it reads the
# org/repo secret SLACK_BOT_TOKEN directly. This intentionally does NOT
# exercise the reusable-workflow `secrets: inherit` path.

on:
  push:
    branches:
      - 'add-slack-notifications'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  slack-test:
    runs-on: ubuntu-latest
    steps:
      - name: Send test message to Slack
        uses: elastic/oblt-actions/slack/send@v1
        with:
          bot-token: ${{ secrets.SLACK_BOT_TOKEN }}
          channel-id: '#logstash-plugin-ci'
          message: ":white_check_mark: Slack smoke test from `${{ github.repository }}` — triggered by `${{ github.actor }}` — <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View run>"
