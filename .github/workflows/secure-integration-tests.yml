name: Plugin Secure Integration Tests

on:
  workflow_call:
    inputs:
      timeout-minutes:
        description: 'Timeout for the test step in minutes'
        type: number
        default: 60

permissions:
  contents: read

jobs:
  secure-integration-tests:
    name: Secure Integration Tests / Stack ${{ matrix.elastic-stack-version }} ${{ matrix.snapshot && '(Snapshot)' || '' }}${{ matrix.es-ssl-key-invalid == 'true' && ' (Invalid SSL)' || '' }}${{ matrix.es-ssl-supported-protocols != '' && format(' ({0})', matrix.es-ssl-supported-protocols) || '' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        elastic-stack-version:
          - '8.current'
          - '9.current'
        snapshot: [false]
        es-ssl-key-invalid: ['false']
        es-ssl-supported-protocols: ['']
        include:
          # SSL key invalid variants
          - elastic-stack-version: '8.current'
            snapshot: false
            es-ssl-key-invalid: 'true'
            es-ssl-supported-protocols: ''
          - elastic-stack-version: '9.current'
            snapshot: false
            es-ssl-key-invalid: 'true'
            es-ssl-supported-protocols: ''
          # TLSv1.3 variants
          - elastic-stack-version: '8.current'
            snapshot: false
            es-ssl-key-invalid: 'false'
            es-ssl-supported-protocols: 'TLSv1.3'
          - elastic-stack-version: '9.current'
            snapshot: false
            es-ssl-key-invalid: 'false'
            es-ssl-supported-protocols: 'TLSv1.3'
          # Snapshot variants
          - elastic-stack-version: '8.current'
            snapshot: true
            es-ssl-key-invalid: 'false'
            es-ssl-supported-protocols: ''
          - elastic-stack-version: '9.current'
            snapshot: true
            es-ssl-key-invalid: 'false'
            es-ssl-supported-protocols: ''
          - elastic-stack-version: '9.next'
            snapshot: true
            es-ssl-key-invalid: 'false'
            es-ssl-supported-protocols: ''
          - elastic-stack-version: 'main'
            snapshot: true
            es-ssl-key-invalid: 'false'
            es-ssl-supported-protocols: ''

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup test environment
        id: setup
        uses: logstash-plugins/.ci/setup@1.x
        with:
          elastic-stack-version: ${{ matrix.elastic-stack-version }}
          snapshot: ${{ matrix.snapshot }}
          integration: true
          secure-integration: true
          es-ssl-key-invalid: ${{ matrix.es-ssl-key-invalid }}
          es-ssl-supported-protocols: ${{ matrix.es-ssl-supported-protocols }}

      - name: Run secure integration tests
        if: steps.setup.outputs.skip != 'true'
        timeout-minutes: ${{ inputs.timeout-minutes }}
        run: bash .ci/docker-run.sh

      - name: Notify Slack on failure
        if: ${{ failure() && github.event_name != 'pull_request' }}
        uses: elastic/oblt-actions/slack/send@v1
        with:
          bot-token: ${{ secrets.SLACK_BOT_TOKEN }}
          channel-id: '#logstash-plugin-ci'
          message: ":red_circle: Secure integration tests failed for `${{ github.repository }}@${{ github.ref_name }}` (Stack ${{ matrix.elastic-stack-version }}${{ matrix.snapshot && ' snapshot' || '' }}) — <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View run>"
