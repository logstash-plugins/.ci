name: Plugin Secure Integration Tests

on:
  workflow_call:
    inputs:
      timeout-minutes:
        description: 'Timeout for the test step in minutes'
        type: number
        default: 60
      ref:
        description: 'Git ref to check out. Defaults to the caller workflow''s ref; set explicitly when a scheduled matrix job needs to test a non-default branch.'
        type: string
        default: ''

permissions:
  contents: read

jobs:
  secure-integration-tests:
    name: Secure Integration Tests / ES ${{ matrix.elastic-stack-version }} ${{ matrix.snapshot && '(Snapshot)' || '' }}${{ matrix.es-ssl-key-invalid == 'true' && ' (Invalid SSL)' || '' }}${{ matrix.es-ssl-supported-protocols != '' && format(' ({0})', matrix.es-ssl-supported-protocols) || '' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        elastic-stack-version:
          - '8.current'
          - '9.current'
        snapshot: [false]
        es-ssl-key-invalid: ['false']
        es-ssl-supported-protocols: ['']
        include:
          # SSL key invalid variants
          - elastic-stack-version: '8.current'
            snapshot: false
            es-ssl-key-invalid: 'true'
            es-ssl-supported-protocols: ''
          - elastic-stack-version: '9.current'
            snapshot: false
            es-ssl-key-invalid: 'true'
            es-ssl-supported-protocols: ''
          # TLSv1.3 variants
          - elastic-stack-version: '8.current'
            snapshot: false
            es-ssl-key-invalid: 'false'
            es-ssl-supported-protocols: 'TLSv1.3'
          - elastic-stack-version: '9.current'
            snapshot: false
            es-ssl-key-invalid: 'false'
            es-ssl-supported-protocols: 'TLSv1.3'
          # Snapshot variants
          - elastic-stack-version: '8.current'
            snapshot: true
            es-ssl-key-invalid: 'false'
            es-ssl-supported-protocols: ''
          - elastic-stack-version: '9.current'
            snapshot: true
            es-ssl-key-invalid: 'false'
            es-ssl-supported-protocols: ''
          - elastic-stack-version: '9.next'
            snapshot: true
            es-ssl-key-invalid: 'false'
            es-ssl-supported-protocols: ''
          - elastic-stack-version: 'main'
            snapshot: true
            es-ssl-key-invalid: 'false'
            es-ssl-supported-protocols: ''

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ inputs.ref }}

      - name: Setup test environment
        id: setup
        uses: logstash-plugins/.ci/setup@1.x
        with:
          elastic-stack-version: ${{ matrix.elastic-stack-version }}
          snapshot: ${{ matrix.snapshot }}
          integration: true
          secure-integration: true
          es-ssl-key-invalid: ${{ matrix.es-ssl-key-invalid }}
          es-ssl-supported-protocols: ${{ matrix.es-ssl-supported-protocols }}

      - name: Run secure integration tests
        if: steps.setup.outputs.skip != 'true'
        timeout-minutes: ${{ inputs.timeout-minutes }}
        run: bash .ci/docker-run.sh
